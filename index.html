<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HangOff 設定</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e8590c">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --line: #e2e5ea;
    --accent: #e8590c;
    --accent-text: #ffffff;
    --ok: #2f9e44;
    --ng: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --card: #1f232b;
      --text: #e8eaed;
      --muted: #9aa0a9;
      --line: #323844;
      --accent: #ff7a2e;
      --accent-text: #15171c;
      --ok: #51cf66;
      --ng: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .status { font-size: 14px; color: var(--muted); }
  .status.on { color: var(--ok); }
  .status.err { color: var(--ng); }

  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
  .live .val { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .live .lbl { font-size: 12px; color: var(--muted); }
  svg.rider { display: block; margin: 8px auto 0; width: 160px; height: 110px; }
  svg.rider .ground { stroke: var(--line); }
  svg.rider .body { fill: var(--accent); }
  svg.rider .bike { stroke: var(--muted); }

  .param { padding: 10px 0; border-top: 1px solid var(--line); }
  .param:first-of-type { border-top: 0; padding-top: 0; }
  .param .head { display: flex; justify-content: space-between; align-items: baseline; }
  .param .name { font-weight: 600; }
  .param .num { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; }
  .param .hint { font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .wide { grid-column: 1 / -1; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>HangOff 設定</h1>

  <div class="card row">
    <div class="grow">
      <div id="status" class="status">未接続</div>
    </div>
    <button id="connect" class="primary">接続</button>
  </div>

  <div class="card">
    <div class="live">
      <div><div class="val" id="board">--</div><div class="lbl">ボードの傾き</div></div>
      <div><div class="val" id="servo">--</div><div class="lbl">サーボ出力</div></div>
    </div>
    <!-- サーボ角に合わせてライダーが傾く -->
    <svg class="rider" viewBox="0 0 160 110" aria-hidden="true">
      <line class="ground" x1="10" y1="100" x2="150" y2="100" stroke-width="2"/>
      <line class="bike" x1="80" y1="100" x2="80" y2="55" stroke-width="6" stroke-linecap="round"/>
      <g id="riderGroup" transform="rotate(0 80 60)">
        <rect class="body" x="72" y="22" width="16" height="38" rx="6"/>
        <circle class="body" cx="80" cy="14" r="10"/>
      </g>
    </svg>
  </div>

  <div class="card" id="params">
    <div class="param">
      <div class="head"><span class="name">比率</span><span class="num" id="ratioVal">-</span></div>
      <div class="hint">サーボ角 ＝ ボードの傾き × 比率</div>
      <input type="range" id="ratio" min="0.1" max="3" step="0.05">
    </div>
    <div class="param">
      <div class="head"><span class="name">最大傾き</span><span class="num" id="limitVal">-</span></div>
      <div class="hint">サーボがこれ以上は傾かない角度</div>
      <input type="range" id="limit" min="5" max="90" step="1">
    </div>
    <div class="param">
      <div class="head"><span class="name">センタートリム</span><span class="num" id="trimVal">-</span></div>
      <div class="hint">ライダーが真っ直ぐになるように微調整</div>
      <input type="range" id="trim" min="-300" max="300" step="5">
    </div>
    <div class="param">
      <div class="head"><span class="name">不感帯</span><span class="num" id="deadbandVal">-</span></div>
      <div class="hint">この角度までの傾きは無視する</div>
      <input type="range" id="deadband" min="0" max="15" step="0.5">
    </div>
    <div class="param">
      <div class="head"><span class="name">なめらかさ</span><span class="num" id="alphaVal">-</span></div>
      <div class="hint">大きいほど振動に強く、小さいほど反応が速い</div>
      <input type="range" id="alpha" min="0.5" max="0.995" step="0.005">
    </div>
    <div class="param">
      <div class="head">
        <span class="name">動きを反転</span>
        <input type="checkbox" id="reverse">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="level">今の傾きを水平にする</button>
      <button id="defaults">初期値に戻す</button>
      <button id="save" class="primary wide">本体に保存</button>
    </div>
    <p class="note">変更はすぐ反映されますが、「本体に保存」を押さないと電源を切ったときに元に戻ります。</p>
  </div>
</main>

<script>
// UUID は HangOff.ino と同じにすること
const uuid = n => `a7c3${n}-5b1e-4d6a-9f2e-3c8b1d0e7a51`;
const SERVICE = uuid('0000');

// スライダーと BLE キャラクタリスティックの対応
const PARAMS = [
  { id: 'ratio',    uuid: uuid('0001'), fmt: v => `× ${v.toFixed(2)}` },
  { id: 'limit',    uuid: uuid('0002'), fmt: v => `${v.toFixed(0)}°` },
  { id: 'trim',     uuid: uuid('0003'), fmt: v => `${v >= 0 ? '+' : ''}${v.toFixed(0)} µs` },
  { id: 'deadband', uuid: uuid('0004'), fmt: v => `${v.toFixed(1)}°` },
  { id: 'alpha',    uuid: uuid('0005'), fmt: v => v.toFixed(3) },
  { id: 'reverse',  uuid: uuid('0006'), fmt: null },
];
const STATUS_UUID  = uuid('0010');
const COMMAND_UUID = uuid('0020');
const CMD = { save: 1, level: 2, defaults: 3 };

const $ = id => document.getElementById(id);
let device = null;
const chars = {};

function setStatus(text, cls = '') {
  const el = $('status');
  el.textContent = text;
  el.className = 'status ' + cls;
}

function setEnabled(on) {
  document.querySelectorAll('#params input, .actions button').forEach(el => el.disabled = !on);
}
setEnabled(false);

const f32 = v => { const b = new DataView(new ArrayBuffer(4)); b.setFloat32(0, v, true); return b.buffer; };

// GATT 操作は同時に1つしかできないので、順番に実行する。
// 同じ項目の書き込みが溜まったら最新の値だけ送る。
let queue = Promise.resolve();
const pending = new Map();
function enqueueWrite(key, fn) {
  const already = pending.has(key);
  pending.set(key, fn);
  if (already) return;
  queue = queue.then(() => {
    const job = pending.get(key);
    pending.delete(key);
    return job();
  }).catch(err => { console.error(err); setStatus('書き込み失敗: ' + err.message, 'err'); });
}

function showValue(p, v) {
  const input = $(p.id);
  if (p.fmt) {
    input.value = v;
    $(p.id + 'Val').textContent = p.fmt(v);
  } else {
    input.checked = v >= 0.5;
  }
}

async function readAll() {
  for (const p of PARAMS) {
    const dv = await chars[p.id].readValue();
    showValue(p, dv.getFloat32(0, true));
  }
}

function onStatus(e) {
  const dv = e.target.value;
  const board = dv.getFloat32(0, true);
  const us = dv.getFloat32(4, true);
  $('board').textContent = `${board.toFixed(1)}°`;
  $('servo').textContent = `${us.toFixed(0)} µs`;
  // 500～2500us → -90～+90°
  const servoDeg = (us - 1500) / 1000 * 90;
  $('riderGroup').setAttribute('transform', `rotate(${servoDeg.toFixed(1)} 80 60)`);
}

// 「接続」ボタン: 一覧から HangOff を選んで接続する
async function pickAndConnect() {
  if (!navigator.bluetooth) {
    setStatus('このブラウザは Bluetooth に対応していません（Android は Chrome、iPhone は Bluefy で開いてください）', 'err');
    return;
  }
  try {
    setStatus('一覧から HangOff を選んでください…');
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    await connect(dev);
  } catch (err) {
    if (err.name === 'NotFoundError') setStatus('未接続');   // 一覧を閉じた
    else setStatus('接続失敗: ' + err.message, 'err');
  }
}

// 前回接続した HangOff に、一覧を出さずに自動でつなぐ (対応ブラウザのみ)
async function autoConnect() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  let devices;
  try { devices = await navigator.bluetooth.getDevices(); } catch { return; }
  const dev = devices.find(d => (d.name || '').startsWith('HangOff')) || devices[0];
  if (!dev) return;

  setStatus('前回の HangOff を探しています…（電源を入れてください）');
  if (dev.watchAdvertisements) {
    // 電波が届いたら接続する
    const onAdv = () => {
      dev.removeEventListener('advertisementreceived', onAdv);
      connect(dev).catch(() => setStatus('未接続'));
    };
    dev.addEventListener('advertisementreceived', onAdv);
    try { await dev.watchAdvertisements(); return; } catch { dev.removeEventListener('advertisementreceived', onAdv); }
  }
  try { await connect(dev); } catch { setStatus('未接続'); }
}

let userDisconnect = false;

async function connect(dev) {
  if (device !== dev) {
    if (device) device.removeEventListener('gattserverdisconnected', onDisconnected);
    device = dev;
    device.addEventListener('gattserverdisconnected', onDisconnected);
  }
  try {
    setStatus('接続中…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    for (const p of PARAMS) chars[p.id] = await service.getCharacteristic(p.uuid);
    chars.command = await service.getCharacteristic(COMMAND_UUID);
    chars.status  = await service.getCharacteristic(STATUS_UUID);

    await readAll();
    chars.status.addEventListener('characteristicvaluechanged', onStatus);
    await chars.status.startNotifications();

    setEnabled(true);
    setStatus(`接続済み: ${device.name || 'HangOff'}`, 'on');
    $('connect').textContent = '切断';
  } catch (err) {
    console.error(err);
    if (device.gatt.connected) device.gatt.disconnect();
    throw err;
  }
}

async function onDisconnected() {
  setEnabled(false);
  $('connect').textContent = '接続';
  $('board').textContent = '--';
  $('servo').textContent = '--';
  if (userDisconnect) { userDisconnect = false; setStatus('切断しました'); return; }

  // 保存時や電波が弱くて切れたときは自動で再接続する
  for (let i = 1; i <= 5; i++) {
    setStatus(`切断されました。再接続しています…（${i}/5）`);
    await new Promise(r => setTimeout(r, 1000));
    try { await connect(device); return; } catch {}
  }
  setStatus('切断されました。「接続」を押してください', 'err');
}

$('connect').addEventListener('click', () => {
  if (device && device.gatt.connected) { userDisconnect = true; device.gatt.disconnect(); }
  else pickAndConnect();
});

autoConnect();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}

for (const p of PARAMS) {
  const input = $(p.id);
  if (p.fmt) {
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      $(p.id + 'Val').textContent = p.fmt(v);
      enqueueWrite(p.id, () => chars[p.id].writeValueWithResponse(f32(v)));
    });
  } else {
    input.addEventListener('change', () => {
      enqueueWrite(p.id, () => chars[p.id].writeValueWithResponse(f32(input.checked ? 1 : 0)));
    });
  }
}

async function sendCommand(cmd, doneText) {
  enqueueWrite('cmd' + cmd, async () => {
    await chars.command.writeValueWithResponse(new Uint8Array([cmd]));
    if (cmd !== CMD.save) await readAll();   // 本体側で変わった値を読み直す
    setStatus(doneText, 'on');
  });
}

$('level').addEventListener('click', () => sendCommand(CMD.level, '今の傾きを水平にしました（保存はまだです）'));
$('defaults').addEventListener('click', () => {
  if (confirm('設定を初期値に戻しますか？')) sendCommand(CMD.defaults, '初期値に戻しました（保存はまだです）');
});
$('save').addEventListener('click', () => sendCommand(CMD.save, '本体に保存しました'));
</script>
</body>
</html>
